<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadiah untukmu 🎁</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    text-align: center;
    padding: 16px;
    overflow: hidden;
  }
  .box { max-width: 420px; }
  .gift { font-size: 72px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  a.btn {
    display: inline-block;
    background: #ff3b6b;
    color: #fff;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  a.btn:active { transform: scale(.96); }

  /* ===== LOADING SCREEN BOM ===== */
  #loading {
    position: fixed;
    inset: 0;
    background: #111;
    display: none;
    z-index: 20;
    overflow: hidden;
  }
  #loading.shake { animation: shake .5s linear; }

  .bomb {
    position: absolute;
    left: 50%;
    top: -120px;
    font-size: 80px;
    line-height: 1;
    transform: translateX(-50%);
    animation: fall 1.6s cubic-bezier(.55, 0, 1, .7) forwards;
  }
  @keyframes fall {
    0%   { top: -120px; transform: translateX(-50%) rotate(-25deg); }
    100% { top: 50%;    transform: translate(-50%, -50%) rotate(15deg); }
  }

  .boom {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: 100px;
    line-height: 1;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  #loading.explode .boom { animation: boom .9s ease-out forwards; }
  @keyframes boom {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 1; }
    40%  { transform: translate(-50%, -50%) scale(3.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(5);   opacity: 0; }
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40px;
    height: 40px;
    border: 6px solid #ffb300;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  #loading.explode .ring { animation: ring .9s ease-out forwards; }
  @keyframes ring {
    0%   { transform: translate(-50%, -50%) scale(0);  opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(30); opacity: 0; }
  }

  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  #loading.explode .flash { animation: flash .7s ease-out forwards; }
  @keyframes flash {
    0%   { opacity: .95; }
    100% { opacity: 0; }
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-14px, 8px); }
    20% { transform: translate(12px, -10px); }
    30% { transform: translate(-10px, -8px); }
    40% { transform: translate(14px, 10px); }
    50% { transform: translate(-12px, 6px); }
    60% { transform: translate(10px, -6px); }
    70% { transform: translate(-6px, 8px); }
    80% { transform: translate(6px, -4px); }
    90% { transform: translate(-3px, 3px); }
  }

  .loading-text {
    position: absolute;
    bottom: 12%;
    left: 0;
    right: 0;
    font-size: 18px;
    letter-spacing: .5px;
    opacity: .85;
  }
  .loading-text::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "."; }
    50%  { content: ".."; }
    75%  { content: "..."; }
  }

  /* ===== FOTO SETELAH LEDAKAN ===== */
  #photo {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 15;
  }
  #photo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes pop {
    0%   { transform: scale(.2); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }

  /* ===== PLAYER ===== */
  #player {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    z-index: 10;
  }
  #player iframe, #player video { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>

<div class="box" id="intro">
  <div class="gift">🎁</div>
  <h1>Selamat! Kamu dapat hadiah spesial</h1>
  <a class="btn" id="claim">Klik di sini untuk menerima hadiah</a>
</div>

<div id="loading">
  <div class="bomb" id="bomb">💣</div>
  <div class="ring"></div>
  <div class="boom">💥</div>
  <div class="flash"></div>
  <div class="loading-text">Menyiapkan hadiah</div>
</div>

<div id="photo"></div>

<div id="player"></div>

<script>
  // ====== PENGATURAN ======
  const YOUTUBE_ID = "iN6b86rFP1A";

  // Kalau mau pakai file video sendiri, isi misalnya "video.mp4"
  const LOCAL_VIDEO = "";

  // Foto yang muncul setelah ledakan (simpan di folder yang sama)
  const FOTO = "ghufron.webp";

  // Berapa lama foto tampil sebelum video (milidetik)
  const DURASI_FOTO = 3000;
  // =========================

  const intro   = document.getElementById("intro");
  const loading = document.getElementById("loading");
  const bomb    = document.getElementById("bomb");
  const photo   = document.getElementById("photo");
  const player  = document.getElementById("player");

  let audioCtx = null;

  // Suara ledakan dibuat dari kode (tanpa file audio)
  function playExplosion() {
    if (!audioCtx) return;
    const ctx = audioCtx;
    const t = ctx.currentTime;
    const dur = 2.2;

    // Letusan: noise yang makin teredam
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;

    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(2000, t);
    lp.frequency.exponentialRampToValueAtTime(60, t + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);

    noise.connect(lp);
    lp.connect(g);
    g.connect(ctx.destination);
    noise.start(t);

    // Dentuman bass
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(28, t + 0.8);
    const og = ctx.createGain();
    og.gain.setValueAtTime(1, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    osc.connect(og);
    og.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 1);
  }

  function playVideo() {
    photo.style.display = "none";
    player.style.display = "block";

    if (LOCAL_VIDEO) {
      player.innerHTML =
        '<video src="' + LOCAL_VIDEO + '" autoplay controls playsinline></video>';
    } else {
      player.innerHTML =
        '<iframe src="https://www.youtube.com/embed/' + YOUTUBE_ID +
        '?autoplay=1&rel=0&playsinline=1" ' +
        'allow="autoplay; encrypted-media; fullscreen" allowfullscreen ' +
        'referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    }
  }

  function showPhoto() {
    loading.style.display = "none";
    const img = new Image();
    img.onload = function () {
      photo.innerHTML = "";
      photo.appendChild(img);
      photo.style.display = "flex";
      setTimeout(playVideo, DURASI_FOTO);
    };
    // Kalau foto tidak ketemu, langsung ke video
    img.onerror = playVideo;
    img.src = FOTO;
  }

  document.getElementById("claim").addEventListener("click", function () {
    // AudioContext harus dibuat saat ada klik supaya suara boleh bunyi
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      audioCtx = new AC();
      audioCtx.resume();
    }

    intro.style.display = "none";
    loading.style.display = "block";

    // Bom jatuh -> meledak (suara) -> foto -> video
    bomb.addEventListener("animationend", function () {
      bomb.style.display = "none";
      loading.classList.add("explode", "shake");
      playExplosion();
      setTimeout(showPhoto, 1100);
    }, { once: true });
  });
</script>

</body>
</html>
